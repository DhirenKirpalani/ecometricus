
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Ecometricus | Luxury Sustainability Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
        // High-Priority HTML-Level Bypass for /MVP access
        if (typeof window !== 'undefined' && /mvp/i.test(window.location.pathname)) {
            sessionStorage.setItem('ecometricus_mvp_bypass', 'true');
        }

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#152E2A',
                            gold: '#C8A413',
                            eco: '#77B139',
                            alert: '#FF3131',
                            energy: '#FF914D'
                        }
                    },
                    fontFamily: {
                        geometric: ['Montserrat', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #152E2A;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .hero-gradient {
            background: linear-gradient(to right, rgba(21, 46, 42, 1) 40%, rgba(21, 46, 42, 0.4) 100%);
        }
        .metric-card {
            border: 1px solid rgba(200, 164, 19, 0.3);
            transition: all 0.3s ease;
        }
        .metric-card:hover {
            border-color: #C8A413;
            box-shadow: 0 0 15px rgba(200, 164, 19, 0.2);
        }

        /* ── Force dark autofill on all inputs ── */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active,
        textarea:-webkit-autofill,
        select:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #0e1f1c inset !important;
            box-shadow:         0 0 0 1000px #0e1f1c inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff !important;
            border-color: rgba(200, 164, 19, 0.25) !important;
            /* Delay transition so the flash never shows */
            transition: background-color 9999s ease-in-out 0s !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
